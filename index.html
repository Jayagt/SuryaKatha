<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuryaKatha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#F6EFE3;
    --ink:#241C15;
    --ink-soft:#4A3E30;
    --gold-line: rgba(232,163,61,0.55);
    --stage:#1B1F3B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Karla',sans-serif;
    color:var(--ivory);
    background: radial-gradient(120% 140% at 50% -10%, var(--stage) 0%, #0c0d1f 65%);
    min-height:100vh;
    transition: background 1.4s ease;
    overflow-x:hidden;
  }
  .display{font-family:'Marcellus',serif;}
  .devanagari{font-family:'Noto Sans Devanagari',serif;}

  /* ---------- Layout ---------- */
  .stage{ max-width:640px; margin:0 auto; padding:10px 20px 100px; }
  .chapter-num{
    margin:0 0 7px; font-size:0.7rem; letter-spacing:0.18em; text-transform:uppercase;
    color:rgba(246,239,227,0.5);
  }
  h1.chapter-title{ font-size:1.7rem; line-height:1.2; margin:0 0 18px; font-weight:400; }

  .card{
    background:var(--ivory); color:var(--ink); border-radius:4px;
    padding:22px 22px 24px; margin:18px 0; box-shadow:0 18px 40px rgba(0,0,0,0.35);
  }
  .card p{ line-height:1.65; margin:0; font-size:1rem; }
  .card p + p{ margin-top:15px; }
  .deva-list{
    margin:18px 0 0; padding:0; list-style:none;
    counter-reset:deva;
  }
  .deva-list li{
    counter-increment:deva;
    position:relative; padding:11px 0 11px 30px;
    border-top:1px solid rgba(27,31,59,0.13);
  }
  .deva-list li:first-child{ border-top:none; padding-top:4px; }
  .deva-list li::before{
    content:counter(deva); position:absolute; left:0; top:12px;
    font-family:'Marcellus',serif; font-size:0.8rem; color:rgba(36,28,21,0.42);
  }
  .deva-list li:first-child::before{ top:5px; }
  .dv-name{ font-family:'Marcellus',serif; font-size:1.05rem; }
  .dv-month{
    margin-left:9px; font-size:0.66rem; letter-spacing:0.11em;
    text-transform:uppercase; color:rgba(36,28,21,0.55); white-space:nowrap;
  }
  .dv-desc{ display:block; margin-top:3px; line-height:1.55; font-size:0.93rem; color:var(--ink-soft); }
  .shloka{
    margin:16px 0 0; padding:14px 16px; border-left:3px solid var(--stage);
    background:rgba(27,31,59,0.05); font-size:1.05rem; line-height:1.9;
  }
  .shloka .translit{ font-style:italic; color:var(--ink-soft); font-size:0.9rem; margin-top:6px; display:block; }

  /* ---------- Book page navigation ---------- */
  .page-indicator{
    text-align:center; font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase;
    color:rgba(246,239,227,0.5); margin:14px 0 0;
  }
  .nav-row{ display:flex; gap:10px; margin-top:22px; }
  .nav-row-fixed{
    position:fixed; left:0; right:0; bottom:0; z-index:15;
    display:flex; gap:10px;
    max-width:640px; margin:0 auto;
    padding:12px 20px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg, rgba(10,11,26,0.96) 55%, rgba(10,11,26,0.7) 85%, transparent);
    backdrop-filter: blur(6px);
  }
  .nav-btn{
    flex:1; padding:14px; border-radius:4px; border:1px solid rgba(246,239,227,0.3);
    background:rgba(246,239,227,0.06); color:var(--ivory); font-family:'Marcellus',serif; font-size:0.98rem;
    letter-spacing:0.02em; cursor:pointer; transition:opacity .2s, background .2s;
  }
  .nav-btn.primary{ background:var(--ivory); color:var(--ink); border:none; }
  .nav-btn:disabled{ opacity:0.28; pointer-events:none; }
  .nav-btn:active{ transform:scale(0.99); }

  /* ---------- Quiz ---------- */
  .quiz-block{ margin:8px 0 4px; }
  .q-count{ font-size:0.72rem; letter-spacing:0.15em; text-transform:uppercase; color:rgba(246,239,227,0.5); margin-bottom:6px; }
  .q-text{ font-size:1.12rem; margin:0 0 14px; font-weight:600; }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt{
    text-align:left; padding:13px 16px; border-radius:4px; border:1px solid rgba(246,239,227,0.3);
    background:rgba(246,239,227,0.06); color:var(--ivory); font-size:0.98rem; font-family:'Karla',sans-serif;
    cursor:pointer; transition:background .2s, border-color .2s, transform .1s;
  }
  .opt:active{ transform:scale(0.99); }
  .opt:disabled{ cursor:default; }
  .opt.correct{ background:rgba(94,166,96,0.25); border-color:#5EA660; }
  .opt.wrong{ background:rgba(196,80,60,0.25); border-color:#C4503C; }
  .opt.reveal-correct{ border-color:#5EA660; box-shadow: inset 0 0 0 1px #5EA660; }
  .explain{
    margin-top:12px; font-size:0.9rem; line-height:1.5; color:rgba(246,239,227,0.85);
    border-left:2px solid var(--gold-line); padding-left:12px;
  }
  .reward-wrap{ text-align:center; margin-top:16px; }
  .reward-sun{ width:56px; height:56px; margin:0 auto; }
  .reward-label{
    font-size:0.7rem; letter-spacing:0.18em; text-transform:uppercase; color:rgba(246,239,227,0.6); margin-top:6px;
  }

  /* ---------- Title screen ---------- */
  .title-screen{
    min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  .sun-hero{ width:180px; height:180px; margin-bottom:8px; }
  .title-screen h1{ font-size:2.6rem; margin:0 0 24px; letter-spacing:0.02em; }
  .intro-tap{
    max-width:440px; padding:6px; background:none; border:none; cursor:pointer;
    color:rgba(246,239,227,0.88); font-family:'Karla',sans-serif; font-size:1rem; line-height:1.65;
  }
  .intro-tap:active{ opacity:0.7; }
  .intro-hint{
    margin-top:18px; font-size:0.72rem; letter-spacing:0.2em; text-transform:uppercase;
    color:rgba(246,239,227,0.4);
  }

  /* ---------- Index screen ---------- */
  .top-back{
    display:inline-flex; align-items:center; gap:7px;
    margin:6px 0 0; padding:10px 14px 10px 0; min-height:44px;
    background:none; border:none; cursor:pointer;
    color:rgba(246,239,227,0.55); font-family:'Karla',sans-serif;
    font-size:0.72rem; letter-spacing:0.16em; text-transform:uppercase;
    transition:color 0.18s ease;
  }
  .top-back .top-back-arrow{ font-size:0.95rem; letter-spacing:0; line-height:1; }
  .top-back:active{ color:var(--ivory); }
  @media (hover:hover){ .top-back:hover{ color:var(--ivory); } }

  .index-header{ text-align:center; padding:14px 10px 4px; }
  .index-header .sun-hero{ width:44px; height:44px; margin:0 auto 8px; }
  .index-header h1{ font-size:1.15rem; margin:0 0 4px; letter-spacing:0.03em; }
  .index-progress{ font-size:0.7rem; color:rgba(246,239,227,0.5); letter-spacing:0.05em; margin:0 0 16px; }
  .index-complete-note{
    max-width:420px; margin:0 auto 20px; font-size:0.85rem; line-height:1.6;
    font-style:italic; font-weight:600;
  }
  .neon-blink{
    animation: neonFlicker 2.6s infinite;
  }
  @keyframes neonFlicker{
    0%, 18%, 22%, 62%, 66%, 100% {
      color:#F6C77A;
      text-shadow:0 0 3px rgba(246,199,122,0.5), 0 0 10px rgba(246,199,122,0.3);
    }
    20%, 64% { color:rgba(246,239,227,0.4); text-shadow:none; }
    40%, 80% {
      color:#F6EFE3;
      text-shadow:0 0 4px rgba(246,239,227,0.4);
    }
  }
  @media (prefers-reduced-motion: reduce){
    .neon-blink{ animation:none; color:#F6C77A; text-shadow:0 0 6px rgba(246,199,122,0.4); }
  }

  .index-grid{
    display:flex; flex-direction:column; gap:1px;
    margin:0 0 10px;
    border-top:1px solid rgba(246,239,227,0.12);
  }
  .index-cell{
    display:flex; flex-direction:row; align-items:center; gap:14px;
    width:100%; text-align:left;
    background:none; border:none; border-bottom:1px solid rgba(246,239,227,0.12);
    cursor:pointer; padding:15px 4px;
    color:rgba(246,239,227,0.88); font-family:'Karla',sans-serif;
    transition:background 0.18s ease, padding-left 0.18s ease;
  }
  .index-cell:active{ background:rgba(246,239,227,0.07); }
  @media (hover:hover){
    .index-cell:hover{ background:rgba(246,239,227,0.05); padding-left:10px; }
  }
  .index-cell .cell-num{
    flex:0 0 2ch; text-align:right;
    font-family:'Marcellus',serif; font-size:1.05rem; color:rgba(246,239,227,0.42);
  }
  .index-cell.complete .cell-num{ color:var(--gold-line); }
  .index-cell .cell-title{
    flex:1; font-size:0.92rem; line-height:1.35;
  }
  .index-cell.complete .cell-title{ color:var(--ivory); }
  .index-cell .cell-check{
    flex:0 0 auto; font-size:0.8rem; color:var(--gold-line);
  }

  .reset-link{
    display:block; text-align:center; margin-top:34px; font-size:0.78rem;
    color:rgba(246,239,227,0.45); text-decoration:underline; cursor:pointer; background:none; border:none;
    font-family:'Karla',sans-serif;
  }

  /* ---------- Inline confirm overlay (window.confirm is blocked in sandboxed previews) ---------- */
  .confirm-overlay{
    position:fixed; inset:0; background:rgba(10,11,26,0.7); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:24px;
  }
  .confirm-box{
    background:var(--ivory); color:var(--ink); border-radius:6px; padding:22px;
    max-width:340px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,0.4);
  }
  .confirm-text{ margin:0 0 4px; font-size:0.98rem; line-height:1.5; }
  .confirm-box .nav-row .nav-btn{ color:var(--ink); border-color:rgba(36,28,21,0.25); background:rgba(36,28,21,0.05); }
  .confirm-box .nav-row .nav-btn.primary{ background:var(--ink); color:var(--ivory); }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<script>
/* ============ CONTENT ============ */
/* Chapter titles are taken verbatim from the section headings in the source document. */
const CHAPTERS = [
  {
    id:0,
    title:'Surya in the Scriptures',
    body:[
      "Surya is called the Pratyakṣa Bhagavān — the one form of God visible to everyone, every single day. Yet daily darshan breeds a strange forgetting: we tend to see the sun as fire and heat, rarely as the source of life, order, and vision that the Ṛṣis revered. His stories appear across the Mārkaṇḍeya Purāṇa, the Bhaviṣyottara Purāṇa, the Viṣṇu Purāṇa, the Matsya Purāṇa, the Rāmāyaṇa, and the Mahābhārata — invoked in the Gāyatrī mantra, honored in the Sandhyāvandanam, remembered in countless stotras.",
      "A story from the Krishna Katha shows how this forgetting gets undone. In Dwaraka, Krishna's son Sambha — born of Jambavatī — grew vain about his own beauty. Sage Nārada warned him that his pride would catch up with him. It did: Sambha looked upon his own mothers with an impure thought while Krishna bathed with his wives, and Krishna cursed him with leprosy, a punishment meant to burn away pride rooted in the body.",
      "Ashamed, Sambha begged for a path back. Krishna sent him to Nārada, who pointed him toward the healer of both body and spirit: Surya."

    questions:[
      { q:"In which story does Sambha's episode appear?", options:["The Rāmāyaṇa","The Krishna Katha","The Matsya Purāṇa","The Mahābhārata"], correct:1, explain:"The episode is introduced as a striking story from the Krishna Katha." },
      { q:"Who is Sambha's mother?", options:["Rukmiṇī","Satyabhāmā","Jambavatī","Yamunā"], correct:2, explain:"Sambha was born of Jambavatī, one of Krishna's eight principal wives." },
      { q:"What curse did Krishna give Sambha?", options:["Blindness","Leprosy","Exile","Muteness"], correct:1, explain:"Krishna cursed Sambha with leprosy, meant to burn away pride rooted in the body." },
      { q:"Which sage first warned Sambha about his pride?", options:["Agastya","Vaiśampāyana","Nārada","Vasiṣṭha"], correct:2, explain:"Nārada sensed Sambha's pride early and warned him it would catch up with him." },
      { q:"In which daily mantra is Surya invoked?", options:["Mahāmṛtyuñjaya","Gāyatrī","Puruṣa Sūkta","Śānti Mantra"], correct:1, explain:"Surya is invoked in the Gāyatrī mantra and honored in the Sandhyāvandanam." }
    ]
  },
  {
    id:1,
    title:'Health from Surya, Wealth from Agni, Knowledge from Īśvara, Liberation from Janārdana',
    body:[
      "Krishna sends Sambha toward Surya through a verse that still guides seekers today: each Devatā carries a dominant guṇa, or quality, and though all are capable of bestowing blessings, a seeker is best served approaching the Devatā most aligned with their aspiration.",
      "Surya is the giver of life, vitality, and clarity — the light of health and dharma. That is why atonement for a curse on the body begins with turning to him."
    ],
    shloka:{
      dev:"आरोग्यं भास्करादिच्छेद्धनमिच्छेद्धुताशनात्। ईश्वराज्ज्ञानमन्विच्छेन्मोक्षमिच्छेज्जनार्दनात्॥",
      translit:"Seek health from Bhāskara (Surya), wealth from Agni, knowledge from Īśvara, and mokṣa from Janārdana."
    },
    questions:[
      { q:"From whom should one seek wealth, per the verse?", options:["Surya","Agni","Īśvara","Janārdana"], correct:1, explain:"The verse assigns wealth to Agni." },
      { q:"From whom should one seek mokṣa?", options:["Bhāskara","Agni","Janārdana","Īśvara"], correct:2, explain:"Mokṣa, liberation, is sought from Janārdana." },
      { q:"From whom should one seek knowledge?", options:["Īśvara","Agni","Surya","Janārdana"], correct:0, explain:"Knowledge is assigned to Īśvara in the verse." },
      { q:"From whom should one seek health?", options:["Agni","Janārdana","Bhāskara (Surya)","Īśvara"], correct:2, explain:"Health is sought from Bhāskara, another name for Surya." },
      { q:"What does the passage say about the Devatās generally?", options:["They are identical in nature","Each carries a dominant quality, though all are interconnected","Only Surya can grant any boon","They are ranked by seniority"], correct:1, explain:"All Devatās are interconnected, but each possesses a dominant guṇa best suited to a particular aspiration." }
    ]
  },
  {
    id:2,
    title:'Brahmā\u2019s Vision of the Light: From Darkness to Sṛṣṭi',
    body:[
      "At the beginning of creation, during the great pralaya, even Brahmā found himself surrounded by tamas, unable to create anything. In meditation, he heard a subtle vibration of sacred syllables emerging from within.",
      "These were the sapta vyāhṛtis, the seven realms, rising from śabda brahman — sound itself: Om Bhūḥ, Om Bhuvaḥ, Om Svaḥ, Om Mahaḥ, Om Janaḥ, Om Tapaḥ, Om Satyam.",
      "Focusing deeply, Brahmā perceived the source of that sound: Omkāra, the Primal Sound — beginningless and endless, subtle, the supreme form of Hari, Para Brahman itself. From that focus, darkness was dispelled and Brahmā beheld light everywhere — but he could not withstand the brilliance, so he prayed to Omkāra to condense into a gentler, sustaining form, a kānti-svarūpa."
    ],
    shloka:{
      dev:"आद्यान्तं यत् परं, सूक्ष्मं हररूपं परं स्थितम् । ॐ इत्युक्तं मया विप्र, तत् परब्रह्म तत्वपुः ॥",
      translit:"That which is beginningless and endless, subtle, the supreme form of Hari, is known as Om — that is Para Brahman itself."
    },
    questions:[
      { q:"What surrounded Brahmā at the start of creation, leaving him unable to create?", options:["Tejas","Tamas","Rasa","Ākāśa"], correct:1, explain:"Brahmā was surrounded by tamas during the great pralaya." },
      { q:"What are the seven sacred syllables Brahmā heard called, collectively?", options:["Sapta Ṛṣis","Sapta Vyāhṛtis","Sapta Lokas","Sapta Svara"], correct:1, explain:"They are the sapta vyāhṛtis, rising from śabda brahman." },

    ]
  },
  {
    id:3,
    title:'From Omkāra to Ādityas: Manifestation through Aditi',

      "As the balance of the worlds tilted toward darkness, with dānavic forces growing stronger, Aditi prayed earnestly to Omkāra for divine intervention. Her intense tapas bore fruit — twelve forms of Omkāra manifested in her garbha as the Dvādaśa Ādityas. Each reflects one divine facet of Surya, ruling a month of the year and pervading creation in its own way:",
      "Together, these Twelve form the cosmic body of Surya — Omkāra made visible in time and space, sustaining creation through seasons, direction, food, water, fire, breath, and light. The Ṛṣis hint at a deep truth: that divine form of Surya is present in all, everywhere. The Ādityas sustain loka-samya, balance in the worlds — and to meditate upon Surya is to recognize that light exists within, just as Brahmā did in the darkness."

        { name:"Dhātā",   month:"Chaitra (Mar\u2013Apr)",   desc:"The one who creates and sustains all living beings." },
        { name:"Parjanya",month:"Phālguna (Feb\u2013Mar)",  desc:"The form that brings nourishing rain and fertility." },
        { name:"Pūṣā",    month:"Māgha (Jan\u2013Feb)",     desc:"Nourishes the earth, causing crops and vegetation to grow." },
        { name:"Tvaṣṭā",  month:"Āśvina (Sep\u2013Oct)",    desc:"Dwells in trees, herbs, and the creative forms of life." },
        { name:"Aryamān", month:"Vaiśākha (Apr\u2013May)",  desc:"The vital life force \u2014 the wind, the breath within the body." },

        { name:"Vivasvān",month:"Bhādrapada (Aug\u2013Sep)",desc:"The fire within \u2014 the power of digestion and transformation." },
        { name:"Viṣṇu",   month:"Kārtika (Oct\u2013Nov)",   desc:"Especially in his Vāmana avatāra, the form that destroys evil and restores dharma." },
        { name:"Aṃśu",    month:"Mārgaśīrṣa (Nov\u2013Dec)",desc:"The gentle form seen in a smile \u2014 the subtle radiance of joy." },
        { name:"Varuṇa",  month:"Āṣāḍha (Jun\u2013Jul)",    desc:"Lord of waters, present in all forms of moisture and in the oceans." },
        { name:"Mitra",   month:"Jyeṣṭha (May\u2013Jun)",   desc:"The divine friend \u2014 harmony, companionship, and unity." }
      ]

    questions:[
      { q:"Which of Kaśyapa's wives is the mother of the Dānavas?", options:["Aditi","Sanjñā","Diti","Chhāyā"], correct:2, explain:"Diti mothered the Dānavas, while her sister-wife Aditi mothered the Devatās." },
      { q:"How many forms of Omkāra manifested as the Ādityas?", options:["Seven","Nine","Ten","Twelve"], correct:3, explain:"Twelve forms of Omkāra manifested in Aditi's womb as the Dvādaśa Ādityas." },
      { q:"Which Āditya takes the Vāmana form and is associated with Kārtika?", options:["Mitra","Indra","Viṣṇu","Bhaga"], correct:2, explain:"Viṣṇu, in his Vāmana avatāra, is linked to the month of Kārtika." },
      { q:"Which Āditya is associated with Śrāvaṇa and represents strength and leadership?", options:["Indra","Varuṇa","Pūṣā","Aṃśu"], correct:0, explain:"Indra governs Śrāvaṇa and represents strength and leadership among the Devas." },
      { q:"What term describes the balance the Ādityas sustain in the worlds?", options:["Sṛṣṭi-krama","Loka-samya","Dharma-cakra","Kāla-cakra"], correct:1, explain:"The Ādityas, born of Aditi, sustain loka-samya — balance in the worlds." }
    ]
  },
  {
    id:4,
    title:'Surya \u2013 The Grihasta',
    body:[
      "Surya enters Gṛhasthāśrama, the householder stage, by marrying Sanjñā, daughter of the celestial architect Viśvakarmā. Though she honors her divine husband, Sanjñā finds it hard to endure his tejas, his intense radiance. She bears three children: Vaivasvata Manu, progenitor of the current Manvantara; Yama, god of death and guardian of dharma; and Yamī, known also as the river Yamunā, a divine nurturer.",

/* ============ COLOR GRADIENT ACROSS CHAPTERS ============ */
const COLOR_STOPS = ['#1B1F3B','#B3401B','#E8A33D','#D97706','#6B2737'];
function hexToRgb(hex){
  hex = hex.replace('#','');
  return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)];
}
function rgbToHex(r,g,b){
  return '#' + [r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
}
function colorAt(t){
  const n = COLOR_STOPS.length;
  const scaled = Math.max(0, Math.min(1,t)) * (n-1);
  const i = Math.min(n-2, Math.floor(scaled));
  const frac = scaled - i;
  const a = hexToRgb(COLOR_STOPS[i]), b = hexToRgb(COLOR_STOPS[i+1]);
  return rgbToHex(a[0]+(b[0]-a[0])*frac, a[1]+(b[1]-a[1])*frac, a[2]+(b[2]-a[2])*frac);
}
CHAPTERS.forEach((ch,i)=>{ ch.color = colorAt(CHAPTERS.length===1 ? 0 : i/(CHAPTERS.length-1)); });

/* ============ STORY PAGINATION ============ */
/* A chapter is one page unless it runs long, in which case it splits into two.
   Chapter bodies fall into two clear bands - 295-838 chars and 1052-1674 - so the
   threshold sits in the gap between them. Never more than two pages. */
const ONE_PAGE_MAX_CHARS = 900;
function paraWeights(ch){
  const w = ch.body.map(p=>p.length);
  if(ch.list) w[ch.list.after] += ch.list.items
    .reduce((a,it)=>a + it.name.length + it.month.length + it.desc.length, 0);
  return w;
}
/* Pages are arrays of paragraph indices, so an attached list stays with its paragraph. */
function paginate(ch){
  const idx = ch.body.map((_,i)=>i);
  const w = paraWeights(ch);
  const total = w.reduce((a,b)=>a+b, 0);
  if(total <= ONE_PAGE_MAX_CHARS || ch.body.length < 2) return [idx];
  // split at whichever paragraph boundary leaves the two pages most even
  let at = 1, bestDiff = Infinity;
  for(let i=1; i<ch.body.length; i++){
    const head = w.slice(0,i).reduce((a,b)=>a+b, 0);
    const diff = Math.abs(head - (total-head));
    if(diff < bestDiff){ bestDiff = diff; at = i; }
  }
  return [idx.slice(0,at), idx.slice(at)];
}
CHAPTERS.forEach(ch=>{ ch.pages = paginate(ch); });

/* ============ SUN IMAGE GENERATOR ============ */
function makeSunSVG(color, opts){
  opts = opts || {};
  const rayCount = opts.rayCount || 16;
  const rays = [];
  for(let i=0;i<rayCount;i++){
    const a = (360/rayCount)*i;
    const long = i % 2 === 0;
    const r1 = 40;
    const r2 = long ? 62 : 52;
    const rad = a*Math.PI/180;
    const x1 = 64 + r1*Math.cos(rad), y1 = 64 + r1*Math.sin(rad);
    const x2 = 64 + r2*Math.cos(rad), y2 = 64 + r2*Math.sin(rad);
    rays.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="${long?3:2}" stroke-linecap="round"/>`);
  }
  const gradId = 'sunGrad-' + color.replace('#','');
  return `
    <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="${gradId}" cx="40%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#FFF3D6"/>
          <stop offset="55%" stop-color="${color}"/>
          <stop offset="100%" stop-color="${color}" stop-opacity="0.85"/>
        </radialGradient>
      </defs>
      ${rays.join('')}
      <circle cx="64" cy="64" r="34" fill="url(#${gradId})"/>
    </svg>
  `;
}

const STORAGE_KEY = 'suryakatha-progress-v2';
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { chapterAnswers:{} };
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
let state = loadState();

function isChapterComplete(ch){
  const answers = state.chapterAnswers[ch.id] || {};
  return ch.questions.every((_,qi)=>answers[qi]!==undefined);
}

/* ============ STAGE COLOR ============ */
function setStageColor(hexColor){
  document.documentElement.style.setProperty('--stage', hexColor);
}

/* ============ SCREENS ============ */
const stageEl = document.getElementById('stage');

function showTitle(){
  setStageColor(COLOR_STOPS[0]);
  stageEl.innerHTML = `
    <div class="title-screen">
      <div class="sun-hero">${makeSunSVG(COLOR_STOPS[0], {rayCount:20})}</div>
      <h1 class="display">Surya Katha</h1>
      <button class="intro-tap" id="enterBtn">
        Vinay Varanasi in an enlightening talk tells us Surya Katha, with a striking episode from Krishna Katha, highlighting how the journey toward Surya began for a prominent figure.
        <div class="intro-hint">Tap to begin</div>
      </button>
    </div>
  `;
  document.getElementById('enterBtn').addEventListener('click', showIndex);
  window.scrollTo({top:0});
}

function showIndex(){
  setStageColor(COLOR_STOPS[0]);
  const completeCount = CHAPTERS.filter(isChapterComplete).length;
  const allComplete = completeCount === CHAPTERS.length;
  stageEl.innerHTML = `
    <button class="top-back" id="titleBtn">
      <span class="top-back-arrow">&larr;</span> Title
    </button>
    <div class="index-header">
      <div class="sun-hero">${makeSunSVG(COLOR_STOPS[Math.floor(COLOR_STOPS.length/2)], {rayCount:16})}</div>
      <h1 class="display">Surya Katha</h1>
      <p class="index-progress">${completeCount} of ${CHAPTERS.length} chapters complete</p>
      ${allComplete ? `<p class="index-complete-note neon-blink">You&rsquo;ve now experienced a summary of Vinay Varanasi&rsquo;s lecture on Surya Katha. Soon the next release &mdash; the meaning of the Āditya Hṛdayam.</p>` : ''}
    </div>
    <div class="index-grid" id="indexGrid"></div>
    <button class="reset-link" id="resetBtn">Reset progress</button>
  `;
  const grid = document.getElementById('indexGrid');
  CHAPTERS.forEach((ch,i)=>{
    const complete = isChapterComplete(ch);
    const cell = document.createElement('button');
    cell.className = 'index-cell' + (complete ? ' complete' : '');
    cell.dataset.idx = i;
    cell.innerHTML = `
      <span class="cell-num">${i+1}</span>
      <span class="cell-title">${ch.title}</span>
      ${complete?'<span class="cell-check">✓</span>':''}
    `;
    grid.appendChild(cell);
  });
  grid.querySelectorAll('.index-cell').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.idx);
      showChapter(idx, 'story', 0);
      window.scrollTo({top:0});
    });
  });
  document.getElementById('resetBtn').addEventListener('click', showResetConfirm);
  document.getElementById('titleBtn').addEventListener('click', showTitle);
  window.scrollTo({top:0});
}

function showChapter(chapterIdx, view, sub){
  const ch = CHAPTERS[chapterIdx];
  setStageColor(ch.color);
  const answers = state.chapterAnswers[ch.id] || {};

  if(!view){
    const answeredKeys = Object.keys(answers);
    if(answeredKeys.length>0){
      view = 'quiz';
      sub = ch.questions.findIndex((_,qi)=>answers[qi]===undefined);
      if(sub === -1) sub = ch.questions.length-1;
    } else {
      view = 'story'; sub = 0;
    }
  }
  if(sub===undefined) sub = 0;

  if(view === 'story') renderStoryPage(chapterIdx, ch, sub);
  else renderQuizQuestion(chapterIdx, ch, answers, sub);
}

function renderList(list){
  return `<ol class="deva-list">` + list.items.map(it=>`
    <li>
      <span class="dv-name">${it.name}</span><span class="dv-month">${it.month}</span>
      <span class="dv-desc">${it.desc}</span>
    </li>`).join('') + `</ol>`;
}

function renderStoryPage(chapterIdx, ch, page){
  const pages = ch.pages;
  const lastPage = pages.length-1;
  page = Math.max(0, Math.min(lastPage, page));
  const isLast = page === lastPage;
  const paras = pages[page].map(i=>
    `<p>${ch.body[i]}</p>` + ((ch.list && ch.list.after===i) ? renderList(ch.list) : '')
  );
  stageEl.innerHTML = `
    <p class="chapter-num">Chapter ${chapterIdx+1}</p>
    <h1 class="chapter-title display">${ch.title}</h1>
    <div class="card">
      ${paras.join('')}
      ${(isLast && ch.shloka) ? `<div class="shloka devanagari">${ch.shloka.dev}<span class="translit">${ch.shloka.translit}</span></div>` : ''}
    </div>
    ${pages.length>1 ? `<p class="page-indicator">Page ${page+1} of ${pages.length}</p>` : ''}
    <div class="nav-row-fixed">
      <button class="nav-btn" id="backBtn">Back</button>
      <button class="nav-btn primary" id="nextBtn">${isLast ? 'Answer the questions' : 'Next page'}</button>
    </div>
    <button class="reset-link" id="resetBtn">Reset progress</button>
  `;
  document.getElementById('backBtn').addEventListener('click', ()=>{
    if(page===0) showIndex();
    else showChapter(chapterIdx, 'story', page-1);
    window.scrollTo({top:0, behavior:'smooth'});
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(isLast) showChapter(chapterIdx, 'quiz', 0);
    else showChapter(chapterIdx, 'story', page+1);
    window.scrollTo({top:0, behavior:'smooth'});
  });
  document.getElementById('resetBtn').addEventListener('click', showResetConfirm);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderQuizQuestion(chapterIdx, ch, answers, qi){
  const q = ch.questions[qi];
  const answered = answers[qi] !== undefined;
  const isCorrect = answered && answers[qi] === q.correct;
  const isLastQ = qi === ch.questions.length-1;

  stageEl.innerHTML = `
    <p class="chapter-num">Chapter ${chapterIdx+1}</p>
    <h1 class="chapter-title display">${ch.title}</h1>
    <div class="quiz-block">
      <p class="q-count">Question ${qi+1} of ${ch.questions.length}</p>
      <p class="q-text">${q.q}</p>
      <div class="options" data-q="${qi}">
        ${q.options.map((opt,oi)=>{
          let cls='opt';
          if(answered){
            if(oi===q.correct) cls+=' reveal-correct';
            if(oi===answers[qi] && oi!==q.correct) cls+=' wrong';
            if(oi===answers[qi] && oi===q.correct) cls+=' correct';
          }
          return `<button class="${cls}" ${answered?'disabled':''} data-oi="${oi}">${opt}</button>`;
        }).join('')}
      </div>
      ${answered?`<div class="explain">${q.explain}</div>`:''}
      ${isCorrect ? `
        <div class="reward-wrap">
          <div class="reward-sun">${makeSunSVG(ch.color)}</div>
          <p class="reward-label">Correct</p>
        </div>
      ` : ''}
    </div>
    <p class="page-indicator">Question ${qi+1} of ${ch.questions.length}</p>
    <div class="nav-row-fixed">
      <button class="nav-btn" id="backBtn">Back</button>
      <button class="nav-btn primary" id="nextBtn" ${answered?'':'disabled'}>${isLastQ ? 'Back to index' : 'Next question'}</button>
    </div>
    <button class="reset-link" id="resetBtn">Reset progress</button>
  `;

  stageEl.querySelector('.options').querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!state.chapterAnswers[ch.id]) state.chapterAnswers[ch.id]={};
      if(state.chapterAnswers[ch.id][qi] !== undefined) return;
      state.chapterAnswers[ch.id][qi] = parseInt(btn.dataset.oi);
      saveState();
      showChapter(chapterIdx, 'quiz', qi);
    });
  });

  document.getElementById('backBtn').addEventListener('click', ()=>{
    if(qi>0) showChapter(chapterIdx, 'quiz', qi-1);
    else showChapter(chapterIdx, 'story', ch.pages.length-1);
    window.scrollTo({top:0, behavior:'smooth'});
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(!answered) return;
    if(isLastQ) showIndex();
    else showChapter(chapterIdx, 'quiz', qi+1);
    window.scrollTo({top:0, behavior:'smooth'});
  });
  document.getElementById('resetBtn').addEventListener('click', showResetConfirm);
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ============ RESET ============ */
function showResetConfirm(){
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = `
    <div class="confirm-box">
      <p class="confirm-text">Reset all progress? This can't be undone.</p>
      <div class="nav-row">
        <button class="nav-btn" id="cancelResetBtn">Cancel</button>
        <button class="nav-btn primary" id="confirmResetBtn">Reset</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('cancelResetBtn').addEventListener('click', ()=>overlay.remove());
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
  document.getElementById('confirmResetBtn').addEventListener('click', ()=>{
    overlay.remove();
    resetProgress();
  });
}
function resetProgress(){
  state = { chapterAnswers:{} };
  saveState();
  showIndex();
}

/* ============ INIT ============ */
showTitle();
</script>
</body>
</html>
