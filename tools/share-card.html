<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0c0d1f;}
  .card{
    width:1200px; height:630px; position:relative; overflow:hidden;
    background: radial-gradient(120% 150% at 22% 30%, #1B1F3B 0%, #0c0d1f 68%);
    display:flex; align-items:center; gap:56px; padding:0 86px;
    box-sizing:border-box; font-family:'Karla',sans-serif;
  }
  .sunwrap{ flex:0 0 300px; height:300px; filter:drop-shadow(0 0 60px rgba(232,163,61,0.30)); }
  .sunwrap svg{ width:100%; height:100%; display:block; }
  .txt{ flex:1; min-width:0; }
  h1{
    font-family:'Marcellus',serif; font-weight:400; color:#F6EFE3;
    font-size:96px; line-height:1.02; margin:0 0 26px; letter-spacing:0.01em;
  }
  .label{
    font-size:19px; letter-spacing:0.26em; text-transform:uppercase;
    color:rgba(246,239,227,0.52); margin:0 0 10px;
  }
  .name{
    font-family:'Marcellus',serif; font-size:52px; line-height:1.1;
    color:#E8A33D; margin:0 0 26px;
  }
  .rule{ width:96px; height:2px; background:rgba(232,163,61,0.55); margin:0 0 24px; }
  .sub{
    font-size:24px; line-height:1.45; color:rgba(246,239,227,0.68);
    margin:0; max-width:620px;
  }
</style></head><body>
<div class="card">
  <div class="sunwrap" id="sun"></div>
  <div class="txt">
    <h1>Surya Katha</h1>
    <div class="rule"></div>
    <p class="label">From the lecture of</p>
    <p class="name">Vinay Varanasi</p>
    <p class="sub">Twelve chapters on the one form of God we see every day &mdash; and know least of all.</p>
  </div>
</div>
<script>
function makeSunSVG(color, opts){
  opts = opts || {};
  const rayCount = opts.rayCount || 16;
  const rays = [];
  for(let i=0;i<rayCount;i++){
    const a = (360/rayCount)*i;
    const long = i % 2 === 0;
    const r1 = 40, r2 = long ? 62 : 52;
    const rad = a*Math.PI/180;
    const x1 = 64 + r1*Math.cos(rad), y1 = 64 + r1*Math.sin(rad);
    const x2 = 64 + r2*Math.cos(rad), y2 = 64 + r2*Math.sin(rad);
    rays.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="${long?3:2}" stroke-linecap="round"/>`);
  }
  return `<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg"><defs>
      <radialGradient id="g" cx="40%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#FFF3D6"/><stop offset="55%" stop-color="${color}"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0.85"/>
      </radialGradient></defs>${rays.join('')}
      <circle cx="64" cy="64" r="34" fill="url(#g)"/></svg>`;
}
document.getElementById('sun').innerHTML = makeSunSVG('#E8A33D', {rayCount:20});
</script></body></html>
